# Application configuration (non-secret, committed).
#
# Secrets (LASTFM_API_KEY, LASTFM_API_SECRET) go in `.env` or environment variables, never here.
# Any value below can be overridden by an environment variable: section and key joined by a
# double underscore, e.g. LASTFM__RATE_LIMIT=1 or HTTP__TIMEOUT=5.
# Point to a different file with APP_CONFIG_FILE=path/to/config.yaml.

lastfm:
  base_url: https://ws.audioscrobbler.com/2.0/
  # Requests per second to Last.fm, evenly spaced, shared by the whole app. Last.fm's ToS
  # historically allowed 5 req/s averaged over 5 minutes; we keep a safety margin.
  rate_limit: 2.0
  # Retries for rate-limited (29) and temporary (8, 11, 16) Last.fm errors.
  max_retries: 2
  # Seconds before the first retry; doubles on each attempt (1s, 2s, ...).
  retry_backoff: 1.0
  # How long Last.fm responses are cached in memory, in seconds.
  cache_ttl: 3600
  # Memory budget of the main response cache, in MB; oldest entries are dropped first. Each entry
  # counts as 4x its JSON size (measured: 1.4-3.6x), so the real footprint stays below this. Entries
  # take ~2-30 KB (info, tags, small lists) up to ~130 KB (limit=100 lists; images already stripped).
  # Sized for a 500 MB container: the app uses ~70 MB at rest, leaving headroom for requests.
  cache_max_mb: 200
  # Max worst-case Last.fm calls for one /artists/similar/network request (1 + limit + limit² for
  # depth 3). Bigger requests get 422. 60 calls = ~30s uncached at 2 req/s; allows depth 3 up to limit 7.
  network_max_calls: 60

# Public (no API key) example endpoints. Their uncached Last.fm calls also pass the shared limiter
# above; these caps come on top. Requests over a cap get 429 + Retry-After right away (no waiting).
examples:
  # Calls per second for all anonymous callers together (out of lastfm.rate_limit).
  rate_limit: 1.5
  # Calls per second per client IP. Must be below rate_limit, or one caller could use the whole
  # public budget and lock everyone else out (checked at startup).
  client_rate_limit: 1.0
  # How many client IPs are tracked at once (oldest dropped first).
  max_clients: 4096
  # Memory budget (MB, counted like lastfm.cache_max_mb) of the public endpoints' own response cache,
  # kept apart from the main cache so public traffic can't push out the entries authenticated
  # requests rely on. Same TTL (lastfm.cache_ttl). Public searches are small (limit <= 10), ~6 KB each.
  cache_max_mb: 8

log:
  # DEBUG adds cache hits and /health requests; INFO logs every request and Last.fm call.
  level: INFO
  # "text" for reading in a terminal, "json" for Railway (one object per line; its log explorer
  # turns the fields into filters, e.g. @status:502). Set LOG__FORMAT=json on Railway.
  format: text

http:
  # Per-request timeout to Last.fm, in seconds.
  timeout: 10.0
  # Last.fm asks for an identifiable User-Agent. Keep the version in sync with pyproject.toml (tested).
  user_agent: lastfm-analytics-api/0.2.0 (+https://github.com/TiagoAdriaNunes/lastfm-analytics-api)
